services:
  db:
    image: postgres:15
    container_name: odoo19-local-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TZ}
    volumes:
      - odoo19-local-db-data:/var/lib/postgresql/data

  odoo:
    build: .
    image: odoo19-local-custom
    container_name: odoo19-local
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TZ}
    volumes:
      - odoo19-local-web-data:/var/lib/odoo
      - ./config/odoo.local.conf:/etc/odoo/odoo.conf:ro
      - ./custom_addons:/mnt/extra-addons:rw

volumes:
  odoo19-local-db-data:
  odoo19-local-web-data:

