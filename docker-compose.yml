services:
  odoo-pg:
    image: postgres:15
    container_name: odoo-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TZ}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    networks:
      - internal

  odoo:
    image: odoo:19.0
    container_name: odoo
    restart: unless-stopped
    depends_on:
      - odoo-pg
    environment:
      - HOST=odoo-pg
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TZ}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./custom_addons:/mnt/extra-addons:rw
    networks:
      - internal
      - n8n_web

networks:
  internal:
    name: odoo_internal
    internal: true
  n8n_web:
    external: true

volumes:
  odoo-db-data:
  odoo-web-data:
